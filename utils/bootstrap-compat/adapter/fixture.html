<!doctype html><html><head><meta charset="utf-8"><title>Adapter contracts</title><style>.fixture-fixed-column{width:75px}</style></head><body>
<button id="opener" data-toggle="modal" data-target="#modal">Open</button><input id="outside">
<div id="modal" class="modal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><button id="dismiss" data-dismiss="modal">Close</button><input id="inside"></div></div></div>
<button id="tip" title="Original" data-toggle="tooltip">Tip</button>
<button id="pop" title="Filters" data-content="&lt;select&gt;&lt;option&gt;One&lt;/option&gt;&lt;/select&gt;" data-toggle="popover">Popover</button>
<div id="legacy-buttons" data-toggle="buttons"><label id="radio-one" class="btn active"><input id="choice-one" type="radio" name="choice" checked> One</label><label id="radio-two" class="btn"><input id="choice-two" type="radio" name="choice"> Two</label><label id="check-button" class="btn"><input id="check-choice" type="checkbox"> Check</label></div>
<button id="collapse-trigger" data-toggle="collapse" data-target="#legacy-collapse" aria-expanded="true">Collapse</button><div id="legacy-collapse" class="collapse in">Collapsed content</div>
<div id="legacy-accordion"><button id="accordion-trigger" data-toggle="collapse" data-target="#accordion-one, .accordion-secondary" data-parent="#legacy-accordion">Accordion</button><div id="accordion-one" class="collapse legacy-accordion-target">One</div><div id="accordion-two" class="collapse legacy-accordion-target accordion-secondary">Two</div></div>
<ul id="tabs" class="nav nav-tabs"><li class="active"><a id="tab-one" href="#pane-one" data-toggle="tab">One</a></li><li><a id="tab-two" href="#pane-two" data-toggle="tab">Two</a></li></ul>
<div class="tab-content"><div id="pane-one" class="tab-pane active in">One pane</div><div id="pane-two" class="tab-pane">Two pane</div></div>
<table id="legacy-list" class="table"><thead><tr><th class="col-actions" style="min-width:125px">Actions</th><th>Name</th><th class="fixture-fixed-column">ID</th></tr></thead><tbody><tr><td>...</td><td>Example</td><td>1</td></tr></tbody></table>
<script>
window.fixtureReady=(async()=>{
 const baseline=new URLSearchParams(location.search).has('baseline');
 const production=new URLSearchParams(location.search).has('production');
 const load=url=>new Promise((resolve,reject)=>{const e=document.createElement('script');e.src=url;e.onload=resolve;e.onerror=()=>reject(Error(url));document.head.append(e)});
 const css=document.createElement('link');css.rel='stylesheet';
 css.href=baseline ? '/assets/build/css/app.css' : (new URLSearchParams(location.search).has('compat') ? '../candidate/app.css' : '../toolchain/node_modules/bootstrap/dist/css/bootstrap.css');
 if(baseline){const manifest=await (await fetch('/assets/build/manifest.json')).json();css.href=manifest['css/app.scss'];}
 await new Promise((resolve,reject)=>{css.onload=resolve;css.onerror=reject;document.head.append(css)});
 await load('/node_modules/jquery/dist/jquery.js');window.mQuery=window.jQuery;
 await load(baseline ? 'baseline/bootstrap-sass/bootstrap.js' : '../toolchain/node_modules/bootstrap/dist/js/bootstrap.bundle.js');
 if(!baseline){
  if(production){
   await load('/app/bundles/CoreBundle/Assets/js/0.bootstrap-3-jquery-adapter.js');
   await load('/app/bundles/CoreBundle/Assets/js/1.bootstrap-compatibility.js');
   if(window.MauticBootstrapCompatibility?.ready) await window.MauticBootstrapCompatibility.ready;
  } else {
   await load('adapter.js');
   if(window.Bootstrap3Compat && !new URLSearchParams(location.search).has('noinstall')) await Bootstrap3Compat.install(mQuery,bootstrap);
  }
 }
 return {baseline,production,version:baseline?jQuery.fn.modal.Constructor.VERSION:bootstrap.Modal.VERSION};
})();
</script></body></html>
